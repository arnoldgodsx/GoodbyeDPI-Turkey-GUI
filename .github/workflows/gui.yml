name: Build GUI

on:
  push:
    paths:
      - 'gui/**'
      - '.github/workflows/gui.yml'
  pull_request:
    paths:
      - 'gui/**'
      - '.github/workflows/gui.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        working-directory: gui
        run: dotnet publish Hub.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: goodbyedpi-turkey-gui
          path: |
            gui/dist
            !gui/dist/*.pdb
