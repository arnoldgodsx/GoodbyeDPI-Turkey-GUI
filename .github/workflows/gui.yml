name: Build GUI

on:
  push:
    paths:
      - 'gui/**'
      - '.github/workflows/gui.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'gui/**'
      - '.github/workflows/gui.yml'
  workflow_dispatch:
    inputs:
      release:
        description: "v<APP_VERSION> Release'ini oluştur/güncelle"
        type: boolean
        default: false

# Derleme salt okunur çalışır; yazma yetkisi sadece release işinde.
permissions:
  contents: read

env:
  APP_VERSION: '1.1'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Motor dosyaları cagritaskn/GoodbyeDPI-Turkey release-0.2.3rc3-turkey ile birebir aynı olmalı.
      # v1.0'da virüslü bir goodbyedpi.exe kuruluma girmişti; hash tutmazsa derleme durur.
      - name: Verify engine binaries
        shell: pwsh
        run: |
          $expected = @{
            'engine/goodbyedpi/x86/goodbyedpi.exe'     = '66e202c9fce9e769e2bc791b7fd6f56f21eab59f607f4ed0724e0c68c430dd1f'
            'engine/goodbyedpi/x86/WinDivert.dll'      = '625ffdd95bfabff32d0e8a95beabcd303c01c8bba73b90402d4e84d6e15dd8e5'
            'engine/goodbyedpi/x86/WinDivert32.sys'    = '29ca5ceb59c9c6993a349e82b1fd46078e6f8a302764153ab84fa22e382fcdca'
            'engine/goodbyedpi/x86/WinDivert64.sys'    = 'e69b5ba3f0cd6cfb2983e442636e7f0b342b61b15264b0328317d4559c82cf50'
            'engine/goodbyedpi/x86_64/goodbyedpi.exe'  = '8d412b094bb9c137ff25ba9a794d1122ecc84bb776debff6c249723a13cc31cd'
            'engine/goodbyedpi/x86_64/WinDivert.dll'   = '6110bfa44667405179c3e15e12af1b62037e447ed59b054b19042032995e6c7e'
            'engine/goodbyedpi/x86_64/WinDivert64.sys' = 'e69b5ba3f0cd6cfb2983e442636e7f0b342b61b15264b0328317d4559c82cf50'
          }
          $found = Get-ChildItem engine -Recurse -File -Include *.exe,*.dll,*.sys | ForEach-Object { (Resolve-Path -Relative $_.FullName) -replace '^\.[\\/]', '' -replace '\\', '/' }
          $extra = $found | Where-Object { -not $expected.ContainsKey($_) }
          if ($extra) { throw "Listede olmayan ikili dosya: $($extra -join ', ')" }
          foreach ($f in $expected.Keys) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $expected[$f]) { throw "$f hash uyuşmuyor: $h" }
            "OK $f"
          }

      # Hedef .NET Framework 4.8 (Windows'ta hazır): çıktı birkaç yüz KB.
      - name: Publish
        run: dotnet publish GoodbyeDPI-Turkey-GUI.csproj -c Release -o dist

      # Arayüz gerçekten açılıyor mu: her sayfayı çizip PNG kaydeder, hata olursa error.txt yazar.
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist\GoodbyeDPI-Turkey-GUI.exe -ArgumentList '--snapshot', "$PWD\snap" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Arayüz zamanında kapanmadı' }
          if (Test-Path snap\error.txt) { Get-Content snap\error.txt; throw 'Arayüz açılırken hata oluştu' }
          if (-not (Test-Path snap\page0.png)) { throw 'Sayfa görüntüleri oluşmadı' }
          Get-ChildItem snap

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: gui/snap

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION installer\setup.iss'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GoodbyeDPI-Turkey-GUI-Setup
          path: gui/installer/Output/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GoodbyeDPI-Turkey-GUI-Setup
          path: out

      - name: Release
        # Üçüncü taraf eylem, yazma yetkili token görür: sabit commit'e bağlı (v2.6.2).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: GoodbyeDPI-Turkey GUI v${{ env.APP_VERSION }}
          files: out/*.exe
          body: |
            Windows kurulum dosyası. `GoodbyeDPI-Turkey-GUI-v${{ env.APP_VERSION }}-Setup.exe` dosyasını indirip çalıştırın;
            program Program Files'a kurulur, masaüstüne ve Başlat menüsüne kısayol eklenir.
            Ek bir şey kurmanız gerekmez (Windows 10/11'deki .NET Framework 4.8 kullanılır). Kaldırmak için: Ayarlar → Uygulamalar → GoodbyeDPI-Turkey.
